name: Build and Release

on:
  # Cutting a tag (git tag vX.Y.Z && git push --tags) builds + releases automatically.
  push:
    tags:
      - "*"
  # ...or run it by hand from the Actions tab ("Run workflow"), supplying a tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.3.0-lxst)"
        required: true
        type: string

jobs:
  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the release in YOUR repo
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Deps
        run: pip install -r requirements.txt

      - name: Install NodeJS Deps
        run: npm install

      - name: Build Electron App (.exe)
        run: npm run dist

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*-win-installer.exe,dist/*-win-portable.exe"

  build_mac:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Deps
        run: pip install -r requirements.txt

      - name: Install NodeJS Deps
        run: npm install

      - name: Build Electron App
        run: npm run dist

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*.dmg"

  build_linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Deps
        run: pip install -r requirements.txt

      - name: Install NodeJS Deps
        run: npm install

      - name: Build Electron App
        run: npm run dist

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*-linux.AppImage"

  build_docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      # ghcr image names must be lowercase; derive it from YOUR account.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reticulum-meshchat" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:lxst
          labels: |
            org.opencontainers.image.title=Reticulum MeshChat
            org.opencontainers.image.description=Docker image for Reticulum MeshChat (rns 1.3.5 / lxmf 1.0.1 / lxst 0.4.8)
