name: Build and Release (LCS)

on:
  # build + push the docker image whenever the lcs branch changes
  push:
    branches:
      - lcs
    tags:
      - "*"
  # allow manual runs from the Actions tab ("Run workflow")
  workflow_dispatch:
    inputs:
      make_release:
        description: "Also build desktop apps + create a release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (only if making a release, e.g. v1.0.0)"
        type: string
        required: false

jobs:

  # Docker image -> pushed to YOUR ghcr namespace, on every push to lcs
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reticulum-meshchat" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:lcs
          labels: |
            org.opencontainers.image.title=LCS MeshChat
            org.opencontainers.image.description=LCS MeshChat - a Liberty Communication Systems distribution of Reticulum MeshChat

  # Desktop apps -> only on tag push, or manual run with make_release = true
  build_windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Build Electron App
        run: npm run dist
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*-win-installer.exe,dist/*-win-portable.exe"

  build_mac:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    strategy:
      matrix:
        os: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Build Electron App
        run: npm run dist
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*-mac-*.dmg"

  build_linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Build Electron App
        run: npm run dist
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: "dist/*-linux.AppImage"
